<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>XClass 下载与更新</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, -apple-system, "Microsoft YaHei", sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f3f6fb; color: #18243a; }
    main { box-sizing: border-box; width: min(92vw, 620px); padding: 32px; border-radius: 20px; background: #fff; box-shadow: 0 12px 40px #243a5c17; }
    h1 { margin: 0 0 8px; font-size: 1.7rem; }
    .version { color: #566780; margin: 0 0 28px; }
    p { line-height: 1.7; }
    .note { margin-top: 28px; font-size: .93rem; color: #566780; }
    @media (prefers-color-scheme: dark) {
      body { background: #111827; color: #eef2f9; }
      main { background: #1b2638; box-shadow: none; }
      .version, .note { color: #bdc9da; }
    }
  </style>
</head>
<body>
  <main>
    <h1>XClass</h1>
    <p class="version">本地课表工具 · Android 8.0 及以上</p>
    <p>应用内更新链路已启用：设置页点击版本号即可手动检查更新，客户端对更新清单做 RSA 验签，并对 APK 校验包名、版本号、哈希与官方签名证书，通过后才下载安装。</p>
    <p class="note">本页面同时作为更新清单与安装包的分发入口。发布流程：打 <code>v*</code> tag → GitHub Actions 用仓库 Secret 中的签名凭据构建签名 APK → 上传安装包并生成 <code>update.json</code> 更新清单（清单由发布密钥签名）→ 客户端即可检测到新版本。</p>
  </main>
</body>
</html>
