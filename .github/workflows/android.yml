name: Android checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK 36
        run: sdkmanager 'platforms;android-36'
      - uses: gradle/actions/setup-gradle@v6
      - name: Test, build, and inspect Android
        run: bash ./gradlew testDebugUnitTest assembleDebug lintDebug --no-daemon

  # 发布签名构建：仅在打 tag（v*）时触发。
  # 签名凭据全部来自 GitHub Secrets（仓库不再提交任何密码/密钥文件）：
  #   ANDROID_KEYSTORE_BASE64  - key.jks 的 base64 文本
  #   ANDROID_STORE_PASSWORD   - store 密码
  #   ANDROID_KEY_PASSWORD     - key 密码
  #   ANDROID_KEY_ALIAS        - 别名（可选，默认 XiaoXiao）
  release:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK 36
        run: sdkmanager 'platforms;android-36'
      - uses: gradle/actions/setup-gradle@v6
      - name: Restore signing keystore from secrets
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          mkdir -p "$RUNNER_TEMP/keystore"
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/keystore/key.jks"
          test -s "$RUNNER_TEMP/keystore/key.jks"
      - name: Build signed release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/keystore/key.jks
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: bash ./gradlew assembleRelease --no-daemon
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: xclass-release-apk
          path: app/build/outputs/apk/release/*.apk
